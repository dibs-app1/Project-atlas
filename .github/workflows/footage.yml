# Real-footage videos: free HD clips from Pixabay with the studio's calm music. A test clip is committed to
# previews/ on this branch so it can be watched straight away.
name: Real footage

on:
  push:
    branches: ["claude/**"]
    paths: ["footage/**", ".github/workflows/footage.yml"]
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan to make"
        required: false
        default: "footage/plans/test.json"

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy==2.1.3
      - name: Make the video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          test -n "$PIXABAY_API_KEY" || { echo "PIXABAY_API_KEY secret is missing"; exit 1; }
          python footage/make.py "${{ inputs.plan || 'footage/plans/test.json' }}" out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: footage-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_credits.txt
      - name: Put the preview on the branch
        run: |
          mkdir -p previews
          for f in out/*.mp4; do
            [ "$(stat -c %s "$f")" -lt 90000000 ] && cp "$f" previews/
          done
          cp out/*_credits.txt previews/
          git config user.name "TheCalmLittleWorld studio"
          git config user.email "studio@users.noreply.github.com"
          git add previews
          git commit -m "Preview: $(ls out/*.mp4 | xargs -n1 basename | tr '\n' ' ')"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
