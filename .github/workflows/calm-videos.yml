# TheCalmLittleWorld studio: renders every video in the active batch in parallel and publishes them
# as a downloadable GitHub Release (mp4 + thumbnail + title/description file for each video).
# The active batch is the manifest named in studio/plan/ACTIVE (or chosen when running it by hand).
name: Calm videos studio

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest to render (leave empty to use studio/plan/ACTIVE)"
        required: false
        default: ""
  push:
    branches: ["claude/**", "main"]
    paths: ["studio/**", ".github/workflows/calm-videos.yml"]

permissions:
  contents: write

concurrency:
  # each batch runs to the end: a new push starts its own run and never cancels one that is rendering
  group: calm-videos-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Producer, Safety Reviewer, Continuity Clerk
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
      manifest: ${{ steps.ids.outputs.manifest }}
      engine: ${{ steps.ids.outputs.engine }}
      batch: ${{ steps.ids.outputs.batch }}
      scenes: ${{ steps.ids.outputs.scenes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - id: ids
        run: |
          manifest="${{ github.event.inputs.manifest }}"
          [ -z "$manifest" ] && manifest="$(cat studio/plan/ACTIVE)"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          python - "$manifest" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          print("ids=" + json.dumps([v["id"] for v in m["videos"]]))
          print("engine=" + str(m.get("engine", 1)))
          print("batch=" + m.get("batch", "batch1"))
          sc = [{"id": v["id"], "k": k} for v in m["videos"] for k in range(len(v["scenes"]))]
          print("scenes=" + json.dumps(sc if m.get("engine", 1) == 4 else [{"id": "none", "k": 0}]))
          PY
      - run: python studio/manager.py --plan-only --manifest "${{ steps.ids.outputs.manifest }}"

  scenes:
    # engine 4: every scene is rendered by Blender (EEVEE, CPU) on its own runner, about 1.5 hours each
    name: Scene ${{ matrix.s.k }} - ${{ matrix.s.id }}
    needs: plan
    if: needs.plan.outputs.engine == '4'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        s: ${{ fromJson(needs.plan.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 fonts-dejavu-core
      - run: pip install bpy==5.2.2 numpy pillow
      - name: Render the scene in Blender
        run: |
          python studio/engine4/render4.py --manifest "${{ needs.plan.outputs.manifest }}" --video "${{ matrix.s.id }}" \
            --scene ${{ matrix.s.k }} --out "output/work/${{ matrix.s.id }}" --res 1280 --samples 2
      - uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.s.id }}-${{ matrix.s.k }}
          path: |
            output/work/${{ matrix.s.id }}/scene_*.mp4
            output/work/${{ matrix.s.id }}/sfx_*.npy
            output/work/${{ matrix.s.id }}/key_*.png
            output/work/${{ matrix.s.id }}/thumb_*.png
          retention-days: 7

  render:
    name: Crew - ${{ matrix.id }}
    needs: [plan, scenes]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - name: Singer's voice (sing-along batches)
        run: |
          if python -c "import json,sys; m=json.load(open(sys.argv[1])); sys.exit(0 if any(v.get('song', {}).get('voice') == 'sung' for v in m['videos']) else 1)" "${{ needs.plan.outputs.manifest }}"; then
            pip install "setuptools<81" piper-tts==1.8.0 pyworld==0.3.5
            # fail fast (before any rendering) if the singer can't sing
            python -c "import sys; sys.path.insert(0, 'studio'); import singer, pyworld; print(singer.ensure_voice()); print(len(singer.sing_word('hello', ((67, 0.5),))))"
          fi
      - name: Collect the Blender scenes (engine 4)
        if: needs.plan.outputs.engine == '4'
        uses: actions/download-artifact@v4
        with: { path: "output/work/${{ matrix.id }}", pattern: "scene-${{ matrix.id }}-*", merge-multiple: true }
      - name: Render
        run: |
          if [ "${{ needs.plan.outputs.engine }}" = "4" ]; then
            ls output/work/${{ matrix.id }}
            python studio/produce3.py "${{ matrix.id }}" --manifest "${{ needs.plan.outputs.manifest }}" --out output --reuse
          elif [ "${{ needs.plan.outputs.engine }}" = "3" ]; then
            python studio/produce3.py "${{ matrix.id }}" --manifest "${{ needs.plan.outputs.manifest }}" --out output
          elif [ "${{ needs.plan.outputs.engine }}" = "2" ]; then
            python studio/produce2.py "${{ matrix.id }}" --manifest "${{ needs.plan.outputs.manifest }}" --out output
          else
            python studio/produce.py "${{ matrix.id }}" --out output --threads 4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.id }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
            output/*.txt
            output/work/*/key_*.png
          retention-days: 30

  publish:
    name: QA Inspector and Publisher
    needs: [plan, render]
    if: ${{ !cancelled() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - uses: actions/download-artifact@v4
        with: { path: output, pattern: "video-*", merge-multiple: true }
      - name: QA gate
        run: python studio/qa.py output "${{ needs.plan.outputs.manifest }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.plan.outputs.batch }}-${{ github.run_number }}"
          n=$(ls output/*.mp4 | wc -l)
          {
            echo "$n original videos for TheCalmLittleWorld. Every one passed QA (length, loudness, flash check, safety review, no repeated scenes)."
            echo
            echo "For each video, download the .mp4, its .jpg thumbnail and its .txt (title, description with chapters, tags)."
            echo "In YouTube Studio set Audience to: Yes, it's made for kids."
          } > notes.md
          gh release create "$tag" --target "${{ github.sha }}" --title "TheCalmLittleWorld - ${{ needs.plan.outputs.batch }} (#${{ github.run_number }})" \
            --notes-file notes.md output/*.mp4 output/*.jpg output/*.txt output/qa_report.json
