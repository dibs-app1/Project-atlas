# TheCalmLittleWorld studio: renders all 10 videos in parallel and publishes them as a
# downloadable GitHub Release (mp4 + thumbnail + title/description file for each video).
name: Calm videos studio

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: ["studio/**", ".github/workflows/calm-videos.yml"]

permissions:
  contents: write

concurrency:
  group: calm-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Producer, Safety Reviewer, Continuity Clerk
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - run: python studio/manager.py --plan-only
      - id: ids
        run: echo "ids=$(python -c "import json;print(json.dumps([v['id'] for v in json.load(open('studio/plan/manifest.json'))['videos']]))")" >> "$GITHUB_OUTPUT"

  render:
    name: Crew - ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - run: python studio/produce.py "${{ matrix.id }}" --out output --threads 4
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.id }}
          path: output/
          retention-days: 30

  publish:
    name: QA Inspector and Publisher
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - uses: actions/download-artifact@v4
        with: { path: output, pattern: "video-*", merge-multiple: true }
      - name: QA gate
        run: python studio/qa.py output
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="calm-videos-${{ github.run_number }}"
          {
            echo "Ten calm, original videos for TheCalmLittleWorld. Every one passed QA."
            echo
            echo "For each video, download the .mp4, its .jpg thumbnail and its .txt (title, description with chapters, tags)."
            echo "In YouTube Studio set Audience to: Yes, it's made for kids."
          } > notes.md
          gh release create "$tag" --target "${{ github.sha }}" --title "TheCalmLittleWorld - 10 calm videos (#${{ github.run_number }})" \
            --notes-file notes.md output/*.mp4 output/*.jpg output/*.txt output/qa_report.json
