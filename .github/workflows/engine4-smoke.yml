# Quick check that Blender (engine 4) runs on a GitHub runner: renders a few frames of one scene.
name: Engine 4 smoke test

on:
  push:
    branches: ["claude/**"]
    paths: ["assets-requests/smoke.txt"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 fonts-dejavu-core
      - run: pip install bpy==5.2.2 numpy pillow
      - run: nproc && free -g
      - name: Render 24 frames
        run: |
          python studio/engine4/render4.py --manifest studio/plan/batch5.json --video 23-birds --scene 8 \
            --out smoke --frames 24 --res 1280 --samples 2
          ls -la smoke
      - uses: actions/upload-artifact@v4
        with: { name: smoke, path: smoke/, retention-days: 3 }
