# Renders the YouTube Shorts in studio/plan/shorts*.json and publishes them as a downloadable Release.
name: Shorts studio

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Shorts plan to render"
        required: false
        default: "studio/plan/shorts1.json"
  push:
    branches: ["claude/**", "main"]
    paths: ["studio/plan/shorts*.json", "studio/shorts.py", "studio/qa_shorts.py", ".github/workflows/shorts.yml"]

permissions:
  contents: write

concurrency:
  group: shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
      plan: ${{ steps.ids.outputs.plan }}
      batch: ${{ steps.ids.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        run: |
          plan="${{ github.event.inputs.plan }}"
          [ -z "$plan" ] && plan="studio/plan/shorts1.json"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          python3 - "$plan" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print("ids=" + json.dumps([s["id"] for s in p["shorts"]]))
          print("batch=" + p.get("batch", "shorts"))
          PY

  render:
    name: Short - ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - run: python studio/shorts.py --plan "${{ needs.plan.outputs.plan }}" --only "${{ matrix.id }}" --out output
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.id }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
            output/*.txt
          retention-days: 30

  publish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy==2.1.3 pillow==11.0.0
      - uses: actions/download-artifact@v4
        with: { path: output, pattern: "short-*", merge-multiple: true }
      - name: QA gate
        run: python studio/qa_shorts.py output
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.plan.outputs.batch }}-${{ github.run_number }}"
          {
            echo "YouTube Shorts for TheCalmLittleWorld (vertical 1080x1920, under 60 seconds). Every one passed QA."
            echo
            echo "Upload each .mp4 from the YouTube app or Studio as a Short; the .txt has the title, description and tags."
            echo "Set Audience to: Yes, it's made for kids."
          } > notes.md
          gh release create "$tag" --target "${{ github.sha }}" --title "TheCalmLittleWorld - Shorts (#${{ github.run_number }})" \
            --notes-file notes.md output/*.mp4 output/*.jpg output/*.txt output/qa_report.json
